<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">CodexDeck, the self-hosted cockpit for Codex CLI</title>
  <desc id="description">A local control plane connects Codex to model providers, approvals, workspaces, and verified deployments.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101923"/>
      <stop offset="0.58" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#121b25"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ee5c6"/>
      <stop offset="1" stop-color="#49bca3"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2732"/>
      <stop offset="1" stop-color="#151e28"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d1e5f2" stroke-opacity=".045"/>
    </pattern>
    <pattern id="microgrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#d1e5f2" stroke-opacity=".022"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#03070a" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#background)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#microgrid)"/>
  <path d="M0 354H1280" stroke="#d1e5f2" stroke-opacity=".08"/>
  <path d="M52 52H1228V368H52Z" fill="none" stroke="#d1e5f2" stroke-opacity=".055"/>

  <g transform="translate(92 86)">
    <rect width="48" height="48" rx="12" fill="url(#mark)"/>
    <path d="M13 15.5 24 9l11 6.5v17L24 39l-11-6.5v-17Z" fill="none" stroke="#0e1a20" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M13.5 16 24 22l10.5-6M24 22v16M18 25.5l-4.5-2.7M30 25.5l4.5-2.7" fill="none" stroke="#0e1a20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="90" y="235" fill="#f4f8fb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="88" font-weight="700">Codex<tspan fill="#83dfc0">Deck</tspan></text>
  <text x="94" y="279" fill="#acbbc7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="400">The self-hosted cockpit for Codex CLI.</text>
  <g transform="translate(94 329)">
    <circle cx="4" cy="4" r="3" fill="#73d6b3"/>
    <text x="17" y="9" fill="#a3b2bf" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">LOCAL CONTROL PLANE</text>
    <path d="M190 4H224" stroke="#546574" stroke-width="1"/>
    <text x="238" y="9" fill="#a3b2bf" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">OPENAI-COMPATIBLE GATEWAY</text>
  </g>

  <g fill="none" stroke="#72d8b7" stroke-opacity=".66" stroke-width="1.2">
    <path d="M750 128h48v38h37"/>
    <path d="M750 300h47v-34h38"/>
    <path d="M1081 164h40v-34h44"/>
    <path d="M1077 267h44v34h44"/>
  </g>
  <g fill="#8fe6c4">
    <circle cx="750" cy="128" r="3"/><circle cx="835" cy="166" r="3"/>
    <circle cx="750" cy="300" r="3"/><circle cx="835" cy="266" r="3"/>
    <circle cx="1165" cy="130" r="3"/><circle cx="1165" cy="301" r="3"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="785" y="92" width="320" height="220" rx="13" fill="url(#panel)" stroke="#40505d" stroke-opacity=".92"/>
    <path d="M785 130H1105" stroke="#40505d" stroke-opacity=".7"/>
    <circle cx="806" cy="111" r="4" fill="#728391"/>
    <circle cx="821" cy="111" r="4" fill="#728391"/>
    <circle cx="836" cy="111" r="4" fill="#73d6b3"/>
    <text x="867" y="115" fill="#9baab7" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10">workspace / task</text>
    <circle cx="809" cy="158" r="8" fill="#1d3a38"/>
    <path d="m805.5 158 2.3 2.4 5-5.5" fill="none" stroke="#83dfc0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="827" y="162" fill="#dce7ee" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11">codex app-server</text>
    <rect x="982" y="148" width="94" height="21" rx="10.5" fill="#172f2c" stroke="#427767"/>
    <circle cx="995" cy="158.5" r="3" fill="#78ddb9"/>
    <text x="1004" y="162" fill="#9be8cb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="600">connected</text>

    <text x="807" y="191" fill="#79c8bd" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10">POST</text>
    <text x="843" y="191" fill="#e5edf2" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10">/v1/responses</text>
    <path d="M807 202H1082" stroke="#35444f"/>
    <text x="807" y="222" fill="#8495a2" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10">model</text>
    <text x="855" y="222" fill="#d1dce4" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10">codexdeck/default</text>
    <text x="807" y="244" fill="#8495a2" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10">approval</text>
    <text x="855" y="244" fill="#e5bf78" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10">awaiting operator</text>
    <rect x="807" y="263" width="119" height="28" rx="6" fill="#82ddbd"/>
    <text x="820" y="281" fill="#10221d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="650">Review action</text>
    <rect x="934" y="263" width="89" height="28" rx="6" fill="#202c36" stroke="#435460"/>
    <text x="950" y="281" fill="#d5e0e7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="550">Workspace</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1012" y="181" width="208" height="102" rx="11" fill="#17212b" stroke="#52616b"/>
    <path d="M1012 213H1220" stroke="#43525e"/>
    <path d="M1031 197 1036 202l-5 5M1041 207h10" fill="none" stroke="#86dcbf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1060" y="202" fill="#c8d6de" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10">safe deploy</text>
    <circle cx="1034" cy="233" r="3.5" fill="#75d7b5"/>
    <text x="1045" y="237" fill="#aab9c4" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="9">probe</text>
    <path d="M1081 233h24" stroke="#596b78"/>
    <circle cx="1112" cy="233" r="3.5" fill="#75d7b5"/>
    <text x="1123" y="237" fill="#aab9c4" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="9">verify</text>
    <path d="M1034 255h24" stroke="#596b78"/>
    <circle cx="1065" cy="255" r="3.5" fill="#e0b56d"/>
    <text x="1076" y="259" fill="#d4c19d" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="9">approve</text>
    <path d="M1130 255h18" stroke="#596b78"/>
    <circle cx="1158" cy="255" r="3.5" fill="#75d7b5"/>
    <text x="1168" y="259" fill="#aab9c4" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="9">ship</text>
  </g>
</svg>
