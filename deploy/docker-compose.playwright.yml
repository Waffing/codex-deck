# Chromium's Linux sandbox uses user namespaces. Keep no-new-privileges and the
# standard image's capabilities. The profile adapts Playwright v1.65.1 for
# namespace-local chroot and the libc clone fallback.
# microsoft/playwright@bbd948344ea9a60bf1e6f125c02ca99b2b51593b
# utils/docker/seccomp_profile.json, Apache-2.0 (licenses/playwright-LICENSE).
services:
  codexdeck:
    security_opt:
      - seccomp:./chromium-seccomp.json
    shm_size: 256m
