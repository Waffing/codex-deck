services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:3.4
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      POST: "1"
      INFO: "1"
      PING: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      ALLOW_RESTARTS: "1"
      AUTH: "0"
      SECRETS: "0"
      SWARM: "0"
      SYSTEM: "0"
      VOLUMES: "0"
      EXEC: "0"
      SERVICES: "0"
      TASKS: "0"
      NODES: "0"
      PLUGINS: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - control
    read_only: true
    tmpfs:
      - /run
      - /tmp:size=4m
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:2375/_ping | grep -qx OK"]
      interval: 10s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  codexdeck:
    image: ${CODEXDECK_IMAGE:-ghcr.io/waffing/codex-deck:latest}
    environment:
      CODEXDECK_HOST: 0.0.0.0
      CODEXDECK_PORT: "3000"
      CODEXDECK_DATA_DIR: /data
      CODEXDECK_WORKSPACES: /workspaces
      CODEXDECK_MASTER_KEY: ${CODEXDECK_MASTER_KEY:-}
      CODEXDECK_DOMAIN: ${CODEXDECK_DOMAIN:-}
      CODEXDECK_COOKIE_SECURE: ${CODEXDECK_COOKIE_SECURE:-}
      CODEXDECK_TRUSTED_HTTP_ORIGINS: ${CODEXDECK_TRUSTED_HTTP_ORIGINS:-}
      CODEXDECK_DEPLOYMENT_NETWORK: codexdeck-net
      CODEXDECK_RELEASE_KEEP: ${CODEXDECK_RELEASE_KEEP:-5}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${CODEXDECK_DATA_PATH:-./data}:/data
      - ${CODEXDECK_WORKSPACES_HOST:-./workspaces}:/workspaces
    ports:
      - 127.0.0.1:${CODEXDECK_BIND_PORT:-3000}:3000
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - codexdeck-net
      - control
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CODEXDECK_MEMORY_LIMIT:-2g}
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2-alpine
    profiles:
      - https
    environment:
      CODEXDECK_DOMAIN: ${CODEXDECK_DOMAIN:-}
    ports:
      - 8080:80
      - 8443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - codexdeck-net
    depends_on:
      codexdeck:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  codexdeck-net:
    name: codexdeck-net
    driver: bridge
  control:
    name: codexdeck-control
    internal: true

volumes:
  caddy_data:
  caddy_config:
