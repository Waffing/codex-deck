name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Verify native Linux quality gate
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo systemctl start "user@$(id -u).service"
          CODEXDECK_VERIFY_SMOKE=native node apps/server/tests/verify-sandbox.mjs
      - name: Verify real Codex approvals and compaction recovery
        run: |
          version=$(sed -n 's/^ARG CODEX_VERSION=//p' deploy/Dockerfile)
          npm install --prefix "$RUNNER_TEMP/codex-fixture" "@openai/codex@$version"
          CODEX_BIN="$RUNNER_TEMP/codex-fixture/node_modules/.bin/codex" node apps/server/tests/native-runner-smoke.mjs
          CODEX_BIN="$RUNNER_TEMP/codex-fixture/node_modules/.bin/codex" CODEXDECK_REAL_CODEX=1 pnpm --filter @codexdeck/server exec vitest run test/real-bridge.test.ts test/compaction-real.test.ts
      - name: Browser console journeys
        run: |
          pnpm --filter @codexdeck/web exec playwright-core install --with-deps chromium
          CODEX_BIN="$RUNNER_TEMP/codex-fixture/node_modules/.bin/codex" pnpm e2e
      - run: python3 deploy/tests/test_backup.py
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Check shell scripts
        run: shellcheck deploy/install.sh deploy/entrypoint.sh deploy/cdx.sh
      - name: Validate Compose configuration
        run: |
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet
          docker compose --profile https --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet
          CODEXDECK_PUBLIC_PORT=26320 docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml -f deploy/docker-compose.public.yml config --quiet
      - name: Verify non-root native build and upgrade recovery
        run: sudo bash deploy/tests/installer.sh
      - name: Capture the V1.5 README gallery from synthetic documents
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node apps/web/tests/readme-gallery.mjs
      - name: Collect README screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web/test-results
        run: |
          mkdir "$RUNNER_TEMP/gallery"
          cp 09-model-center.png       "$RUNNER_TEMP/gallery/gateway.png"
          cp workbench-tools-open-desktop.png "$RUNNER_TEMP/gallery/workbench-pine.png"
          cp flagship-paper-mobile.png "$RUNNER_TEMP/gallery/workbench-paper-mobile.png"
          cp 03-workbench-desktop.png "$RUNNER_TEMP/gallery/workbench.png"
          cp 02-approval-desktop.png  "$RUNNER_TEMP/gallery/approval.png"
          cp 04-approval-mobile.png   "$RUNNER_TEMP/gallery/mobile.png"
          cp 14-review-1440.png       "$RUNNER_TEMP/gallery/review.png"
          cp 14-vault-1440.png        "$RUNNER_TEMP/gallery/vault.png"
          cp artifact-hub.png document-viewer.png global-search.png public-share.png "$RUNNER_TEMP/gallery/"
      - name: Upload README screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readme-gallery
          path: ${{ runner.temp }}/gallery/*.png
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  image-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        playwright: [false, true]
    env:
      CODEXDECK_IMAGE: codexdeck:ci
      CODEXDECK_BIND_PORT: 3150
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate image
        run: docker buildx build --load --file deploy/Dockerfile --build-arg INSTALL_PLAYWRIGHT=${{ matrix.playwright }} --tag codexdeck:ci .
      - name: Boot production stack and verify managed deployment
        env:
          CODEXDECK_REQUIRE_BROWSER: ${{ matrix.playwright && '1' || '0' }}
        run: |
          export CODEXDECK_MASTER_KEY=$(openssl rand -hex 32)
          export CODEXDECK_DATA_PATH="$RUNNER_TEMP/smoke/data" CODEXDECK_WORKSPACES_HOST="$RUNNER_TEMP/smoke/workspaces"
          files=(-f deploy/docker-compose.yml)
          if [[ "$CODEXDECK_REQUIRE_BROWSER" == 1 ]]; then files+=(-f deploy/docker-compose.playwright.yml); fi
          trap 'docker compose "${files[@]}" down --volumes --remove-orphans' EXIT
          docker compose "${files[@]}" up -d --wait --wait-timeout 150
          curl --fail --silent http://127.0.0.1:3150/api/health | jq -e '.status == "ok"'
          curl --fail --silent http://127.0.0.1:3150/ | grep -qi '<!doctype html>'
          export CODEXDECK_SMOKE_CONTAINER=$(docker compose "${files[@]}" ps -q codexdeck)
          docker exec "$CODEXDECK_SMOKE_CONTAINER" sh -c 'test "$(sed -n "s/^Uid:[[:space:]]*\([0-9]*\).*/\1/p" /proc/1/status)" = "$PUID"'
          node apps/server/tests/docker-deployment-smoke.mjs
          if [[ "$CODEXDECK_REQUIRE_BROWSER" == 0 ]]; then node apps/server/tests/isolated-runner-smoke.mjs; fi
          if [[ "$CODEXDECK_REQUIRE_BROWSER" == 0 ]]; then
            docker exec -i --workdir /app/apps/server/dist --user 1000:1000 --env TMPDIR=/workspaces --env CODEXDECK_VERIFY_SMOKE=docker "$CODEXDECK_SMOKE_CONTAINER" node --input-type=module - < apps/server/tests/verify-sandbox.mjs
          fi
      - name: Export tested Linux runtime for low-memory hosts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.playwright == false
        run: |
          container=$(docker create codexdeck:ci)
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir "$RUNNER_TEMP/runtime"
          docker cp "$container:/app/." "$RUNNER_TEMP/runtime/"
          tar -czf "$RUNNER_TEMP/runtime-linux-amd64.tar.gz" -C "$RUNNER_TEMP/runtime" .
      - name: Upload tested runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.playwright == false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-linux-amd64
          path: ${{ runner.temp }}/runtime-linux-amd64.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
