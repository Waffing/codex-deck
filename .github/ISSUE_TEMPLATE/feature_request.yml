name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: English and Simplified Chinese are welcome. Use the Security tab for private vulnerability reports.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow and its current limitation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues
          required: true
        - label: This request does not include secrets or private workspace data
          required: true

